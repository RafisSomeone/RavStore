name: CI

on:
  push:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [spotlessCheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: ./gradlew --no-daemon ${{ matrix.task }}
  build:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - run: ./gradlew --no-daemon bootJar

